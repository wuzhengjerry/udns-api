<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta name="viewport" content="width=device-width" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>UDNS待办流程提醒</title>
    <style>
        @charset "utf-8";
        /* CSS Document */
        .tabtop13 {
            margin-top: 13px;
        }
        .tabtop13 td{
            background-color:#ffffff;
            height:25px;
            line-height:150%;
        }
        .font-center{ text-align:center}
        .btbg{background:#e9faff !important;}
        .btbg1{background:#f2fbfe !important;}
        .btbg2{background:#f3f3f3 !important;}
        .biaoti{
            font-family: 微软雅黑;
            font-size: 26px;
            font-weight: bold;
            border-bottom:1px dashed #CCCCCC;
            color: #255e95;
        }
        .titfont {

            font-family: 微软雅黑;
            font-size: 16px;
            font-weight: bold;
            color: #2c679e;
            background: url(../images/ico3.gif) no-repeat 15px center;
            background-color:#e9faff;
        }
        .titlefont {

            font-family: 微软雅黑;
            font-size: 16px;
            font-weight: bold;
            color: #255e95;
        }
        .tabtxt2 {
            font-family: 微软雅黑;
            font-size: 14px;
            font-weight: bold;
            text-align: right;
            padding-right: 10px;
            color:#327cd1;
        }
        .tabtxt3 {
            font-family: 微软雅黑;
            font-size: 14px;
            padding-left: 15px;
            color: #000;
            margin-top: 10px;
            margin-bottom: 10px;
            line-height: 20px;
        }
    </style>
</head>

<body>
<table width="100%" border="0" cellspacing="0" cellpadding="0" align="center">
    <tr>
        <td align="center" class="biaoti" height="60">UDNS待办流程提醒</td>
    </tr>
    <tr>
        <td align="right" height="25">若需咨询请联系jamesduan</td>
    </tr>
</table>

<h3 class="titlefont">您有如下流程待处理：</h3>
<table width="90%" border="0" cellspacing="1" cellpadding="4" bgcolor="#cccccc" class="tabtop13" align="center">
    <tr>
        <td width="10%" class="btbg font-center titfont" rowspan="1">流程ID</td>
        <td width="10%" class="btbg font-center titfont" rowspan="1">主题</td>
        <td width="10%" class="btbg font-center titfont" rowspan="1">创建人</td>
        <td width="10%" class="btbg font-center titfont" rowspan="1">进度</td>
        <td width="10%" class="btbg font-center titfont" rowspan="1">创建时间</td>
        <td width="10%" class="btbg font-center titfont" rowspan="1">耗时</td>
        <td width="10%" class="btbg font-center titfont" rowspan="1">详情</td>
    </tr>

    {{  range $i, $v := . }}
    <tr>
        <td width="10%" class="btbg1 font-center " rowspan="1">{{ $v.ID }}</td>
        <td width="10%" class="btbg2 font-center " rowspan="1">{{ $v.Name }}</td>
        <td width="10%" class="btbg2 font-center " rowspan="1">{{ $v.Creator }}</td>
        <td width="10%" class="btbg2 font-center " rowspan="1">{{ $v.Progress }}</td>
        <td width="10%" class="btbg2 font-center " rowspan="1">{{ $v.StartTime }}</td>
        <td width="10%" class="btbg2 font-center " rowspan="1">{{ $v.TimeCost }}</td>
        <td width="10%" class="btbg2 font-center " rowspan="1"><a href="http://test.udns.woa.com/#/flows/task/{{ $v.ID }}">点击查看详情</a></td>
    </tr>
    {{ end }}
</table>

</body>

</html>
