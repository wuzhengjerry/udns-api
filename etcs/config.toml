[app]
name = "udns-api"
host = "0.0.0.0"
port = "8060"
key = "default"
mode = "dev"
goroutine_size = 20
chan_size = 500
x_check_ip = false

[log]
level = "debug"
path_dir = "log"
format = "json"
to = "file"

[mongo]
endpoints = ["127.0.0.1:27017"]
username = "mongouser"
password = "xxxxxx"
database = "admin"

[cache]
# or type = "memory"
type = "redis"
is_cache = false

[cache.redis]
prefix = ""
address = "127.0.0.1:6379"
db = 0
password = ""
default_ttl = 300

[qflow]
addr = "http://127.0.0.1"
token = "xxxxxx"
project_id = 148
project_name = "udns-web"
auto_operate_token = "udns-dev"

[bqueue]
addr = ""
topic = "UDNS_center_test"
group = "UDNS"
version = "2.4.2"
assignor = "roundrobin"
oldest = true

[nops]
webapi_host = "http://t127.0.0.1"
i_gate_token = "xxxxxx"
host = "nops.woa.com"
port = "80"
hmac_key = ""
hmac_secret = ""


[flyPigeon]
addr = "http://127.0.0.1"
hmac_id = "abc"
hmac_secret = "xxxxxx"
corp_id = "xxxxxx"
corp_secret = "xxxxxx"
app_key = "xxxxxx"
sys_id = "26070"
mail_send_from = "UDNS@tencent.com"

[tof]
host = "http://127.0.0.1"
#paas_id = "xxxxxx"
#paas_token = "xxxxxx"
paas_id = "paasfront_udns_com"
paas_token = "xxxxxx"
gslb_host = "https://xxx.com"
sniper_host = "http://sniper.com"

[email]
server_host = "smtp@tencent.com"
server_port = 465sss
from_email = "udns@tencent.com"
passwd = ""

[oudns]
addr = "http://127.0.0.1/cgi-bin/udns/"
system_id = 1111
proposer = "xxxx"
add_api = "add_domain"
add_zone_api = "add_zone_mnop"
mod_api = "mod_domain"
del_api = "delete_domain"
query_api = "get_domain_conf"
batch_query_api = "get_domain_conf_batch"
batch_mod_api = "mod_domain_batch"

[itapi]
addr = "http://test.srv.ittoolacom"
